<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MinimalTechRo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--border:#222;--accent:#00ff87;--accent2:#ff3c3c;--text:#f0f0f0;--muted:#666;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;line-height:1.7;}
    header{position:sticky;top:0;z-index:100;background:rgba(10,10,10,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;height:60px;}
    .logo{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--accent);text-decoration:none;}
    nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-left:24px;transition:color 0.2s;}
    nav a:hover{color:var(--text);}
    .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;color:var(--muted);}
    .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .not-found{text-align:center;padding:80px 20px;max-width:500px;margin:0 auto;}
    .not-found h1{font-size:80px;font-weight:800;color:var(--border);margin-bottom:16px;}
    .not-found h2{font-size:24px;font-weight:700;margin-bottom:12px;}
    .not-found p{color:var(--muted);margin-bottom:24px;}
    .btn-back{display:inline-block;background:var(--accent);color:#000;padding:12px 24px;font-weight:700;font-size:13px;text-decoration:none;text-transform:uppercase;}
    .container{max-width:760px;margin:0 auto;padding:clamp(32px,5vw,64px) clamp(16px,4vw,32px);}
    .breadcrumb{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:24px;}
    .breadcrumb a{color:var(--muted);text-decoration:none;}
    .breadcrumb a:hover{color:var(--accent);}
    .tag{display:inline-block;font-family:'Space Mono',monospace;font-size:10px;padding:4px 10px;border-radius:2px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:16px;}
    .tag-review{background:rgba(0,255,135,0.1);border:1px solid rgba(0,255,135,0.2);color:var(--accent);}
    .tag-guide{background:rgba(255,60,60,0.1);border:1px solid rgba(255,60,60,0.2);color:var(--accent2);}
    .tag-compare{background:rgba(100,100,255,0.1);border:1px solid rgba(100,100,255,0.2);color:#7c7cff;}
    h1{font-size:clamp(28px,5vw,48px);font-weight:800;letter-spacing:-0.03em;line-height:1.1;margin-bottom:20px;}
    .meta{display:flex;gap:20px;align-items:center;margin-bottom:24px;flex-wrap:wrap;}
    .meta-item{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);}
    .rating{display:flex;gap:3px;margin-bottom:24px;}
    .star{color:var(--accent);font-size:20px;}
    .star.empty{color:var(--border);}
    .hero-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:2px;margin-bottom:32px;display:block;}
    .hero-img-contain{width:100%;aspect-ratio:16/9;object-fit:contain;background:#fff;padding:24px;border-radius:2px;margin-bottom:32px;display:block;}
    .intro-box{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);padding:20px 24px;margin-bottom:40px;font-size:16px;line-height:1.7;color:#ccc;}

    /* ===== PRODUCTS LIST SECTION ===== */
    .products-list-section{margin:0 0 40px;}
    .products-list-label{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
    .products-list-label::after{content:'';flex:1;height:1px;background:var(--border);}

    /* Single product card */
    .prod-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:12px;display:flex;gap:0;}
    .prod-card:hover{border-color:rgba(0,255,135,0.3);}
    .prod-card-num{background:var(--surface2);border-right:1px solid var(--border);padding:16px 14px;display:flex;align-items:center;justify-content:center;min-width:44px;}
    .prod-card-num-text{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);}
    .prod-card-img-wrap{width:110px;flex-shrink:0;background:#fff;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border);}
    .prod-card-img{width:100%;height:90px;object-fit:contain;padding:8px;}
    .prod-card-body{flex:1;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:4px;}
    .prod-card-name{font-size:15px;font-weight:700;color:var(--text);line-height:1.3;}
    .prod-card-price{font-family:'Space Mono',monospace;font-size:13px;color:var(--accent);}
    .prod-card-cta{flex-shrink:0;display:flex;align-items:center;padding:14px;}
    .prod-card-btn{display:inline-block;background:var(--accent);color:#000;padding:10px 16px;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;text-decoration:none;text-transform:uppercase;white-space:nowrap;transition:opacity 0.2s;}
    .prod-card-btn:hover{opacity:0.85;}

    /* Compact grid for 4+ products */
    .products-grid-section{margin:0 0 40px;}
    .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
    .prod-grid-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;transition:border-color 0.2s;}
    .prod-grid-card:hover{border-color:rgba(0,255,135,0.3);}
    .prod-grid-num{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);padding:8px 12px 0;letter-spacing:0.1em;}
    .prod-grid-img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;padding:12px;}
    .prod-grid-body{padding:12px;flex:1;display:flex;flex-direction:column;gap:4px;}
    .prod-grid-name{font-size:13px;font-weight:700;color:var(--text);line-height:1.3;flex:1;}
    .prod-grid-price{font-family:'Space Mono',monospace;font-size:12px;color:var(--accent);}
    .prod-grid-btn{display:block;background:var(--accent);color:#000;text-align:center;padding:10px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;text-decoration:none;text-transform:uppercase;margin:8px 12px 12px;transition:opacity 0.2s;}
    .prod-grid-btn:hover{opacity:0.85;}
    .products-disclaimer{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);text-align:center;margin-top:8px;}

    .article-content{font-size:15px;line-height:1.8;color:#bbb;}
    .article-content h2{font-size:clamp(20px,3vw,26px);font-weight:700;letter-spacing:-0.02em;margin:40px 0 16px;color:var(--text);}
    .article-content h3{font-size:18px;font-weight:700;margin:28px 0 12px;color:var(--text);}
    .article-content p{margin-bottom:16px;}
    .article-content strong{color:var(--text);}
    .article-content a{color:var(--accent);text-decoration:none;}
    .article-content a:hover{text-decoration:underline;}
    .article-content ul,.article-content ol{padding-left:20px;margin-bottom:16px;}
    .article-content li{margin-bottom:6px;}
    .article-content img{width:100%;border-radius:4px;margin:16px 0;}
    .article-content table{width:100%;border-collapse:collapse;margin:24px 0;font-size:14px;}
    .article-content th{background:var(--surface2);color:var(--muted);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);}
    .article-content td{padding:10px 14px;border-bottom:1px solid var(--border);color:#bbb;}

    .cta-section{margin:32px 0;}
    .cta{display:block;background:var(--accent);color:#000;text-align:center;padding:18px 24px;font-weight:700;font-size:15px;letter-spacing:0.05em;text-decoration:none;margin-bottom:8px;transition:opacity 0.2s;text-transform:uppercase;}
    .cta:hover{opacity:0.85;}
    .cta-secondary{display:block;background:transparent;color:var(--text);text-align:center;padding:14px 24px;font-weight:700;font-size:14px;letter-spacing:0.05em;text-decoration:none;border:1px solid var(--border);margin-bottom:8px;transition:border-color 0.2s;text-transform:uppercase;}
    .cta-secondary:hover{border-color:var(--accent);}
    .disclaimer{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);text-align:center;margin-bottom:32px;}

    .related{border-top:1px solid var(--border);padding-top:32px;margin-top:48px;}
    .related h3{font-size:14px;font-family:'Space Mono',monospace;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:16px;}
    .related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
    .related-card{background:var(--surface);border:1px solid var(--border);padding:16px;text-decoration:none;color:inherit;transition:border-color 0.2s;display:flex;flex-direction:column;gap:6px;}
    .related-card:hover{border-color:var(--accent);}
    .related-card-img{width:100%;aspect-ratio:16/9;object-fit:cover;margin-bottom:4px;background:var(--surface2);}
    .related-card-tag{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);}
    .related-card-title{font-size:13px;font-weight:700;line-height:1.4;}
    .related-card-arrow{font-size:14px;color:var(--accent);margin-top:auto;}

    .share-bar{display:flex;gap:10px;margin:32px 0;flex-wrap:wrap;align-items:center;}
    .share-label{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);}
    .share-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;text-decoration:none;cursor:pointer;transition:border-color 0.2s,color 0.2s;}
    .share-btn:hover{border-color:var(--accent);color:var(--accent);}

    footer{border-top:1px solid var(--border);padding:24px clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:48px;}
    .footer-left{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);}
    @media(max-width:600px){nav{display:none;}.prod-card{flex-direction:column;}.prod-card-img-wrap{width:100%;height:140px;border-right:none;border-bottom:1px solid var(--border);}.prod-card-cta{padding:0 14px 14px;}.prod-card-btn{width:100%;text-align:center;display:block;}}
  </style>
</head>
<body>

<header>
  <a href="/" class="logo">MINIMALTECHRO</a>
  <nav>
    <a href="/">Produse</a>
    <a href="/blog.html">Blog</a>
    <a href="/despre.html">Despre</a>
  </nav>
</header>

<div id="page-content">
  <div class="loading">
    <div class="spinner"></div>
    <span>Se incarca articolul...</span>
  </div>
</div>

<footer>
  <div class="footer-left">© 2026 MinimalTechRo</div>
  <div class="footer-left">
    <a href="/confidentialitate.html" style="color:var(--muted);text-decoration:none;">Confidentialitate</a> ·
    <a href="/termeni.html" style="color:var(--muted);text-decoration:none;">Termeni</a>
  </div>
</footer>

<script>
const SB_URL='https://sysheihugyeuvwxbpvxc.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5c2hlaWh1Z3lldXZ3eGJwdnhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMTMzMTIsImV4cCI6MjA4ODY4OTMxMn0.jYwwm5BR30Nj_5naoK1XMw6wRwxdrqco5ydbFBgAIFY';
const db=supabase.createClient(SB_URL,SB_KEY);

function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function tagClass(t){return t==='review'?'tag-review':t==='guide'?'tag-guide':'tag-compare';}
function tagLabel(t){return t==='review'?'Recenzie':t==='guide'?'Ghid':'Comparatie';}
function stars(r){if(!r)return '';let s='';for(let i=1;i<=5;i++)s+=`<span class="star${i>r?' empty':''}">★</span>`;return `<div class="rating">${s}</div>`;}
function fmtDate(iso){if(!iso)return '';return new Date(iso).toLocaleDateString('ro-RO',{day:'numeric',month:'long',year:'numeric'});}

function show404(){
  document.getElementById('page-content').innerHTML=`<div class="not-found"><h1>404</h1><h2>Articol negasit</h2><p>Articolul pe care il cauti nu exista sau a fost mutat.</p><a href="/blog.html" class="btn-back">← Inapoi la Blog</a></div>`;
}

// Build products section HTML
function buildProductsSection(produse) {
  if (!produse || !Array.isArray(produse) || produse.length === 0) return '';

  const count = produse.length;

  // For 1-3 products: horizontal list cards
  if (count <= 3) {
    const cards = produse.map((p, i) => {
      const hasImg = p.imagine && p.imagine.trim();
      return `
        <div class="prod-card">
          <div class="prod-card-num"><span class="prod-card-num-text">#${i+1}</span></div>
          ${hasImg ? `<div class="prod-card-img-wrap"><img class="prod-card-img" src="${esc(p.imagine)}" alt="${esc(p.nume)}" loading="lazy" onerror="this.parentElement.style.display='none'"></div>` : ''}
          <div class="prod-card-body">
            <div class="prod-card-name">${esc(p.nume||'Produs')}</div>
            ${p.pret ? `<div class="prod-card-price">${esc(p.pret)}</div>` : ''}
          </div>
          ${p.link ? `<div class="prod-card-cta"><a href="${esc(p.link)}" target="_blank" rel="noopener sponsored" class="prod-card-btn">Cumpara →</a></div>` : ''}
        </div>`;
    }).join('');
    return `
      <div class="products-list-section">
        <div class="products-list-label">🛒 Produse Recomandate</div>
        ${cards}
        <div class="products-disclaimer">* Linkuri afiliate — sustii MinimalTechRo fara costuri suplimentare.</div>
      </div>`;
  }

  // For 4+ products: grid cards
  const cards = produse.map((p, i) => {
    const hasImg = p.imagine && p.imagine.trim();
    return `
      <div class="prod-grid-card">
        <div class="prod-grid-num"># ${i+1}</div>
        ${hasImg ? `<img class="prod-grid-img" src="${esc(p.imagine)}" alt="${esc(p.nume)}" loading="lazy" onerror="this.style.display='none'">` : ''}
        <div class="prod-grid-body">
          <div class="prod-grid-name">${esc(p.nume||'Produs')}</div>
          ${p.pret ? `<div class="prod-grid-price">${esc(p.pret)}</div>` : ''}
        </div>
        ${p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener sponsored" class="prod-grid-btn">Cumpara →</a>` : ''}
      </div>`;
  }).join('');
  return `
    <div class="products-grid-section">
      <div class="products-list-label">🛒 Produse Recomandate (${count})</div>
      <div class="products-grid">${cards}</div>
      <div class="products-disclaimer">* Linkuri afiliate — sustii MinimalTechRo fara costuri suplimentare.</div>
    </div>`;
}

async function loadRelated(currentId, tag) {
  const{data}=await db.from('articole')
    .select('titlu,slug,imagine_url,produse_lista,tag,read_time')
    .eq('publicat',true).eq('tag',tag).neq('id',currentId).limit(3);
  return data||[];
}

async function loadArticle(){
  const params=new URLSearchParams(window.location.search);
  const slug=params.get('slug');
  if(!slug){show404();return;}

  try{
    const{data,error}=await db.from('articole').select('*').eq('slug',slug).eq('publicat',true).single();
    if(error||!data){show404();return;}

    document.title=`${data.titlu} | MinimalTechRo`;

    const setMeta=(prop,content)=>{let el=document.querySelector(`meta[property="${prop}"]`);if(!el){el=document.createElement('meta');el.setAttribute('property',prop);document.head.appendChild(el);}el.setAttribute('content',content);};
    const prods = Array.isArray(data.produse_lista) ? data.produse_lista : [];
    const ogImg = data.imagine_url || prods[0]?.imagine || 'https://www.adriangsofficial.shop/minimaltechro-logo.jpeg';
    setMeta('og:title',data.titlu);
    setMeta('og:description',data.excerpt||'');
    setMeta('og:image',ogImg);
    setMeta('og:url',`https://www.minimaltechro.net/blog-articol.html?slug=${slug}`);
    setMeta('og:type','article');

    let canon=document.querySelector('link[rel="canonical"]');
    if(!canon){canon=document.createElement('link');canon.rel='canonical';document.head.appendChild(canon);}
    canon.href=`https://www.minimaltechro.net/blog-articol.html?slug=${slug}`;

    const related=await loadRelated(data.id,data.tag);
    const relatedHTML=related.length?`
      <div class="related">
        <h3>// Articole corelate</h3>
        <div class="related-grid">
          ${related.map(r=>{
            const rProds=Array.isArray(r.produse_lista)?r.produse_lista:[];
            const rImg=r.imagine_url||(rProds[0]?.imagine)||'';
            return `<a class="related-card" href="/blog-articol.html?slug=${esc(r.slug)}">
              ${rImg?`<img class="related-card-img" src="${esc(rImg)}" alt="${esc(r.titlu)}" loading="lazy" onerror="this.style.display='none'">`:'' }
              <span class="related-card-tag">${tagLabel(r.tag)} · ${esc(r.read_time||'5 min')}</span>
              <span class="related-card-title">${esc(r.titlu)}</span>
              <span class="related-card-arrow">↗</span>
            </a>`;
          }).join('')}
          <a class="related-card" href="/blog.html"><span class="related-card-tag">Toate articolele</span><span class="related-card-title">Inapoi la Blog</span><span class="related-card-arrow">←</span></a>
        </div>
      </div>`
      :'<div class="related"><a href="/blog.html" style="color:var(--accent);text-decoration:none;font-family:\'Space Mono\',monospace;font-size:13px;">← Inapoi la Blog</a></div>';

    // Hero image
    const heroUrl=data.imagine_url;
    const imgIsProduct=heroUrl&&(heroUrl.includes('hollyland')||heroUrl.includes('zeblaze')||heroUrl.includes('emagst')||heroUrl.includes('logitech')||heroUrl.includes('dji')||heroUrl.includes('rode')||heroUrl.includes('redragon'));
    const imgClass=imgIsProduct?'hero-img-contain':'hero-img';

    // Products section
    const productsHTML = buildProductsSection(prods);

    // Fallback CTA for old articles without produse_lista
    const fallbackCTA = (!productsHTML && (data.link_afiliat||data.link_afiliat2)) ? `
      <div class="cta-section">
        ${data.link_afiliat?`<a href="${esc(data.link_afiliat)}" target="_blank" rel="noopener sponsored" class="cta">Vezi Pretul Cel Mai Bun →</a>`:''}
        ${data.link_afiliat2?`<a href="${esc(data.link_afiliat2)}" target="_blank" rel="noopener sponsored" class="cta-secondary">Vezi Al Doilea Produs →</a>`:''}
        <p class="disclaimer">* Linkuri afiliate — sustii MinimalTechRo fara costuri suplimentare.</p>
      </div>` : '';

    document.getElementById('page-content').innerHTML=`
      <div class="container">
        <div class="breadcrumb"><a href="/">Acasa</a> → <a href="/blog.html">Blog</a> → ${esc(data.titlu)}</div>
        <span class="tag ${tagClass(data.tag)}">${tagLabel(data.tag)}</span>
        <h1>${esc(data.titlu)}</h1>
        <div class="meta">
          <span class="meta-item">📅 ${fmtDate(data.updated_at||data.created_at)}</span>
          <span class="meta-item">⏱ ${esc(data.read_time||'5 min')} citire</span>
          ${data.categorie?`<span class="meta-item">📁 ${esc(data.categorie)}</span>`:''}
        </div>
        ${stars(data.rating)}
        ${heroUrl?`<img class="${imgClass}" src="${esc(heroUrl)}" alt="${esc(data.titlu)}" loading="eager" onerror="this.style.display='none'">` : ''}
        ${data.excerpt?`<div class="intro-box">${esc(data.excerpt)}</div>`:''}
        ${productsHTML}
        <div class="article-content">${data.continut||''}</div>
        ${fallbackCTA}
        <div class="share-bar">
          <span class="share-label">Distribuie:</span>
          <a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" target="_blank" rel="noopener">Facebook</a>
          <a class="share-btn" href="https://twitter.com/intent/tweet?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(data.titlu)}" target="_blank" rel="noopener">Twitter</a>
          <button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href);this.textContent='✓ Copiat!'">Copiaza link</button>
        </div>
        ${relatedHTML}
      </div>`;

  }catch(e){
    document.getElementById('page-content').innerHTML=`<div class="not-found"><h1>⚠️</h1><h2>Eroare</h2><p>${e.message}</p><a href="/blog.html" class="btn-back">← Inapoi la Blog</a></div>`;
  }
}

loadArticle();
</script>
</body>
</html>
